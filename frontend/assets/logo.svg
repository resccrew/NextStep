<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16271D"/><stop offset=".55" stop-color="#0B1510"/><stop offset="1" stop-color="#050A07"/></linearGradient>
<radialGradient id="glow" cx=".72" cy=".28" r=".7"><stop offset="0" stop-color="#7CFF8A" stop-opacity=".45"/><stop offset=".5" stop-color="#22C55E" stop-opacity=".12"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/></radialGradient>
<linearGradient id="st" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#16A34A"/><stop offset=".5" stop-color="#4ADE80"/><stop offset="1" stop-color="#E6FF7A"/></linearGradient>
<linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9CFFB0" stop-opacity=".7"/><stop offset=".5" stop-color="#9CFFB0" stop-opacity=".05"/><stop offset="1" stop-color="#9CFFB0" stop-opacity=".35"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#4ADE80" stroke-opacity=".07" stroke-width="1.5"/></pattern>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".6"/></filter>
<filter id="ng" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
<clipPath id="tile"><rect width="512" height="512" rx="120"/></clipPath>
</defs>
<g clip-path="url(#tile)">
<rect width="512" height="512" fill="url(#bg)"/>
<rect width="512" height="512" fill="url(#grid)"/>
<rect width="512" height="512" fill="url(#glow)"/>
<!-- orbit rings -->
<circle cx="256" cy="268" r="196" fill="none" stroke="#4ADE80" stroke-opacity=".14" stroke-width="2"/>
<circle cx="256" cy="268" r="164" fill="none" stroke="#4ADE80" stroke-opacity=".22" stroke-width="2" stroke-dasharray="4 10"/>
<path d="M60 268a196 196 0 0 1 340-133" fill="none" stroke="url(#st)" stroke-width="4" stroke-linecap="round" opacity=".8"/>
<!-- step bars -->
<g opacity=".9"><rect x="96" y="436" width="64" height="12" rx="6" fill="#16A34A" opacity=".35"/><rect x="176" y="426" width="64" height="22" rx="6" fill="#22C55E" opacity=".45"/><rect x="256" y="416" width="64" height="32" rx="6" fill="#4ADE80" opacity=".55"/><rect x="336" y="404" width="64" height="44" rx="6" fill="#BEF264" opacity=".65"/></g>
<!-- glow under mark -->
<g filter="url(#ng)" opacity=".7" fill="none" stroke="#4ADE80" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"><path d="M140 380V264a78 78 0 0 1 156 0v116"/><path d="M296 250L384 162"/><path d="M300 140h104v104"/></g>
<!-- echo shadow layer -->
<g fill="none" stroke="#052e16" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" transform="translate(10 12)" opacity=".8"><path d="M140 380V264a78 78 0 0 1 156 0v116"/><path d="M296 250L384 162"/><path d="M300 140h104v104"/></g>
<!-- main mark -->
<g filter="url(#sh)" fill="none" stroke="url(#st)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"><path d="M140 380V264a78 78 0 0 1 156 0v116"/><path d="M296 250L384 162"/><path d="M300 140h104v104"/></g>
<!-- highlight -->
<g fill="none" stroke="url(#hl)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" transform="translate(-10 -10)" opacity=".8"><path d="M140 370V264a78 78 0 0 1 156 0"/><path d="M310 140h94"/></g>
<!-- sparkles -->
<g fill="#E6FF7A"><circle cx="430" cy="96" r="7"/><circle cx="452" cy="138" r="3.5"/><circle cx="398" cy="74" r="3"/></g>
<path d="M440 210l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#E6FF7A" opacity=".9"/>
</g>
<rect x="2" y="2" width="508" height="508" rx="118" fill="none" stroke="url(#rim)" stroke-width="4"/>
</svg>
